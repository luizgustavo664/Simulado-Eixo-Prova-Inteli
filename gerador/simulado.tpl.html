<script>
// Banco gerado a partir dos cadernos em questõespdf/: cada questão é um recorte (img/<id>.png) com a posição [x, y] de cada alternativa
const BANK = /*BANK*/[];
const PROVAS = [
  { id: "2025.1", adapt: true, desc: "Adaptativa · prova de 27/10/2024" },
  { id: "2024.1", adapt: true, desc: "Adaptativa · prova de 22/10/2023" },
  { id: "2023.1", adapt: false, desc: "24 questões fixas" },
  { id: "2022.2", adapt: false, desc: "24 questões fixas · com resolução" },
  { id: "2022.1", adapt: false, desc: "24 questões fixas" },
];
const SIZES = [8, 6, 6, 4], DURATION = 120 * 60e3, L = "ABCDE";
// Pontos por questão no nível mais alto de cada bloco: o bloco 1 (o mais fácil) vale mais e o peso cai a cada bloco;
// cada nível abaixo vale 15% menos. Máximo = 7×6 + 5×5 + 5×4,2 + 3×4 = 100.
// ponytail: valores estimados, o edital não publica os reais. Provas clássicas usam a regra da época: 5 pontos por questão.
const BASE = [6, 5, 4.2, 4];

const pool = (p, b, lv) => BANK.filter(q => q.prova === p && q.b === b && q.lv === lv);
const nLevels = (p, b) => new Set(BANK.filter(q => q.prova === p && q.b === b).map(q => q.lv)).size;
const prova = id => PROVAS.find(p => p.id === id);
function points(p, b, lv) {
  if (!prova(p).adapt) return 5;
  return b === 0 ? BASE[0] : +(BASE[b] * (1 - 0.15 * (nLevels(p, b) - 1 - lv))).toFixed(2);
}
// edital 5.1.1: a questão descartada fica fora da correção; sem descarte, 1 questão respondida corretamente é
// desconsiderada (penalidade). Descartes a mais e questões em branco contam como erro. A plataforma não impede nada.
function grade(qs, ans, disc) {
  let excl = disc.length ? disc[0] : qs.findIndex((q, i) => ans[i] === q.ans);
  const penalty = !disc.length && excl >= 0;
  if (excl < 0) excl = qs.length - 1;
  let c = 0, n = 0;
  qs.forEach((q, i) => { if (i === excl) return; n++; if (!disc.includes(i) && ans[i] === q.ans) c++; });
  return { c, n, up: c * 2 > n, excl, penalty }; // acertar mais que a metade sobe de trilha
}
// confere o banco: cada nível de cada bloco tem o tamanho certo, e a pontuação máxima é 100
for (const p of PROVAS) for (let b = 0; b < 4; b++) for (let lv = 0; lv < nLevels(p.id, b); lv++)
  console.assert(pool(p.id, b, lv).length === SIZES[b], "tamanho do bloco", p.id, b, lv);
for (const p of PROVAS) console.assert(Math.round(SIZES.reduce((a, n, b) => a + (n - 1) * points(p.id, b, b ? nLevels(p.id, b) - 1 : 0), 0)) === 100, "máximo 100", p.id);
const Q3 = [{ans:0},{ans:1},{ans:2}];
console.assert(grade(Q3, {0:0,1:1}, [2]).up && !grade(Q3, {0:0}, [2]).up, "roteamento");
console.assert(grade(Q3, {0:0,1:1,2:2}, []).c === 2 && grade(Q3, {0:0,1:1,2:2}, []).penalty, "sem descarte perde 1 acerto");
console.assert(grade(Q3, {0:0,1:1,2:2}, [2,1]).c === 1, "descarte a mais conta como erro");

// edital 2027, itens 8.3.1 a 8.3.3: notas que substituem o Eixo Prova e a equivalência em acertos (10 a 15)
const EXAMES = {
  enem: { nome: "ENEM", campo: "Matemática e suas Tecnologias", anos: "2024 ou 2025", min: 770, passo: 32, max: 962, dec: true, ex: "812,4" },
  sat: { nome: "SAT", campo: "SAT Math", anos: "2025 ou 2026", min: 690, passo: 18, max: 800, ex: "730" },
  act: { nome: "ACT", campo: "ACT Math", anos: "2025 ou 2026", min: 31, passo: 1, max: 36, ex: "33" },
  ib: { nome: "IB", campo: "Math (Analysis and Approaches ou Applications and Interpretations)", anos: "2025 ou 2026",
        ib: { SL: { nome: "Standard", notas: { 6: 10, 7: 12 } }, HL: { nome: "Higher", notas: { 5: 10, 6: 12, 7: 14 } } } },
};
const ibAcertos = (nivel, nota) => EXAMES.ib.ib[nivel].notas[nota] ?? null;
console.assert(ibAcertos("SL", 5) === null && ibAcertos("SL", 6) === 10 && ibAcertos("SL", 7) === 12
  && ibAcertos("HL", 4) === null && ibAcertos("HL", 5) === 10 && ibAcertos("HL", 6) === 12 && ibAcertos("HL", 7) === 14, "equivalência IB");
const acertosEquiv = (e, nota) => nota < e.min ? null : Math.min(15, 10 + Math.floor((nota - e.min) / e.passo));
const faixa = (e, a) => {
  const de = e.min + (a - 10) * e.passo, ate = a < 15 ? de + e.passo - (e.dec ? 0.1 : 1) : e.max;
  return de === ate ? String(de) : `${de} a ${String(+ate.toFixed(1)).replace(".", ",")}`;
};
{ const { enem, sat, act } = EXAMES, t = acertosEquiv;
  console.assert(t(enem, 769.9) === null && t(enem, 770) === 10 && t(enem, 801.9) === 10 && t(enem, 802) === 11 && t(enem, 930) === 15
    && t(sat, 680) === null && t(sat, 690) === 10 && t(sat, 707) === 10 && t(sat, 708) === 11 && t(sat, 780) === 15 && t(sat, 800) === 15
    && t(act, 30) === null && t(act, 31) === 10 && t(act, 34) === 13 && t(act, 36) === 15, "equivalências"); }
let equiv = { ex: "enem", nota: "", nivel: "HL" };

const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let s, tick, chosen = PROVAS[0].id;

const REPO = "luizgustavo664/Simulado-Eixo-Prova-Inteli";
let stars = null;
const starred = () => { try { return localStorage.getItem("estrelou") === "1"; } catch { return false; } };
// mascote original: estrelinha com rosto, dança em loop depois do clique
const MASCOT = `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2.5l5.3 11 12 1.6-8.8 8.3 2.2 11.9L20 29.6 9.3 35.3l2.2-11.9-8.8-8.3 12-1.6z" fill="#f5b301" stroke="#c98a00" stroke-width="1.6" stroke-linejoin="round"/><circle cx="16" cy="19" r="1.9" fill="#2e2640"/><circle cx="24" cy="19" r="1.9" fill="#2e2640"/><path d="M16 23.5q4 3.6 8 0" fill="none" stroke="#2e2640" stroke-width="1.6" stroke-linecap="round"/><circle cx="13" cy="22.5" r="1.4" fill="#ff8a7a" opacity=".8"/><circle cx="27" cy="22.5" r="1.4" fill="#ff8a7a" opacity=".8"/></svg>`;
const starBtn = () => starred()
  ? `<a class="star done" href="https://github.com/${REPO}" target="_blank" rel="noopener"><span class="mascot">${MASCOT}<i aria-hidden="true">♪</i></span> Valeu pela estrela!<span class="count" data-stars>${stars ?? ""}</span></a>`
  : `<a class="star" href="https://github.com/${REPO}" target="_blank" rel="noopener"><span aria-hidden="true">★</span> Deixe uma estrela no GitHub<span class="count" data-stars>${stars ?? ""}</span></a>`;
const starWrap = () => `<span class="star-wrap">${starBtn()}<small class="plea">${starred() ? "valeu, futuro Inteler! 🥳" : "por favor 😭😭"}</small></span>`;
// contagem de estrelas pela API pública do GitHub; se falhar (sem rede, limite, visualizador bloqueia), o botão fica sem número

let celebrateOnReturn = false;
document.addEventListener("click", e => {

function welcomeBack() {
  celebrateOnReturn = false;

  const a = document.querySelector("a.star"); if (a) celebrate(a);

function celebrate(a) {
  a.classList.remove("pop"); void a.offsetWidth; a.classList.add("pop");
  const r = a.querySelector("span").getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < 12; i++) {
    const sp = document.createElement("span"), ang = (i / 12) * 2 * Math.PI, d = 45 + Math.random() * 35;
    sp.className = "spark"; sp.textContent = "★";
    Object.assign(sp.style, { left: cx - 7 + "px", top: cy - 8 + "px" });
    sp.style.setProperty("--dx", Math.cos(ang) * d + "px"); sp.style.setProperty("--dy", Math.sin(ang) * d + "px");
    document.body.appendChild(sp); setTimeout(() => sp.remove(), 900);
  }
}

// histórico: no db privado de cada pessoa (data/users/<id>); sem db (arquivo local, sem login), fica no navegador
const hist = { list: [], ready: false, where: "" };
let histCol = null;
const localHist = () => { try { return JSON.parse(localStorage.getItem("historico") || "[]"); } catch { return []; } };
const saveLocal = () => { try { localStorage.setItem("historico", JSON.stringify(hist.list.slice(0, 200))); } catch {} };
(async () => {
  try {
    const [db, user] = await Promise.all([window.claude?.use?.("db"), window.claude?.use?.("user")]);
    const uid = await user?.id?.();
    if (db && uid) {
      histCol = db.collection("data/users/" + uid);
      const snap = await histCol.orderBy("at", "desc").limit(200).get();
      hist.list = snap.docs.map(d => d.data());
      hist.where = "Salvo na sua conta, visível só para você.";
    } else throw 0;
  } catch { histCol = null; hist.list = localHist(); hist.where = "Salvo só neste navegador."; }
  hist.ready = true;
  renderHistory();
})();
async function saveAttempt(rec) {
  hist.list.unshift(rec);
  if (histCol) { try { await histCol.add(rec); return; } catch { histCol = null; hist.where = "Salvo só neste navegador."; } }
  saveLocal();
}
function renderHistory() {
  const el = document.getElementById("hist"); if (!el) return;
  if (!hist.ready) { el.innerHTML = `<p class="note">Carregando suas tentativas…</p>`; return; }
  if (!hist.list.length) { el.innerHTML = `<p class="note">Nenhuma tentativa ainda. Sua nota aparece aqui quando você terminar uma prova.</p>`; return; }
  const best = {}; hist.list.forEach(r => { if (!r.eliminated) best[r.prova] = Math.max(best[r.prova] ?? 0, r.score); });
  const fmt = n => n.toFixed(1).replace(".", ",");
  el.innerHTML = `<div class="scroll"><table class="hist">
    <thead><tr><th>Data</th><th>Prova</th><th class="num">Nota</th><th class="num">Acertos</th><th class="num">Tempo</th><th class="num">Saídas</th></tr></thead>
    <tbody>${hist.list.slice(0, 30).map(r => `<tr>
      <td>${new Date(r.at).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</td>
      <td>${r.prova}</td><td class="num n">${r.eliminated ? `<span style="color:var(--bad)">Eliminado</span>` : fmt(r.score) + (r.score === best[r.prova] ? " ★" : "")}</td>
      <td class="num">${r.hits}/20</td><td class="num">${r.minutes} min</td><td class="num">${r.trocas ?? "–"}</td></tr>`).join("")}</tbody></table></div>
    <p class="note">★ melhor nota em cada prova. ${hist.where}</p>`;
}

let away = false;

  if (!s || s.done || away || !document.getElementById("slide")) return;
  away = true; s.trocas++; saveProgress(); showTrocas();
}
document.addEventListener("visibilitychange", () => { if (document.hidden) leave(); else away = false; });

// andamento salvo no navegador: atualizar a página retoma a prova (e conta como saída da tela)
const byId = Object.fromEntries(BANK.map(q => [q.id, q])), ids = qs => qs.map(q => q.id);
function saveProgress() {
  if (free()) Object.assign(s.blocks[s.b], { qs: s.qs, ans: s.ans, disc: s.disc, cur: s.cur });
  const blocks = s.blocks?.map(x => ({ ...x, qs: ids(x.qs) }));
  try { localStorage.setItem("andamento", JSON.stringify({ ...s, blocks, qs: ids(s.qs), res: s.res.map(r => ({ ...r, qs: ids(r.qs) })) })); } catch {}
}
function loadProgress() {
  try {
    const d = JSON.parse(localStorage.getItem("andamento") || "null"); if (!d || d.done) return null;
    d.qs = d.qs.map(id => byId[id]); d.res = d.res.map(r => ({ ...r, qs: r.qs.map(id => byId[id]) }));
    if (d.blocks) { d.blocks.forEach(x => x.qs = x.qs.map(id => byId[id])); d.qs = d.blocks[d.b].qs; }
    return d.qs.every(Boolean) && d.res.every(r => r.qs.every(Boolean)) && (d.blocks || []).every(x => x.qs.every(Boolean)) ? d : null;
  } catch { return null; }
}
const clearProgress = () => { try { localStorage.removeItem("andamento"); } catch {} };

function renderEquivOut() {
  const e = EXAMES[equiv.ex], out = document.getElementById("equiv-out"), nota = parseFloat(String(equiv.nota).replace(",", "."));

  document.querySelectorAll("#equiv tr[data-k]").forEach(tr => tr.classList.toggle("hit", a != null && tr.dataset.k === key));

    : `<div class="score"><span class="big">${a}</span><span class="kv">acertos equivalentes na prova do Inteli, de 20</span></div>
       <p class="note">Os 10 acertos são só a régua de equivalência do edital, não a nota de corte: o corte muda a cada ano conforme os candidatos, e já houve aprovação com 8 acertos. Se você fizer a prova e também enviar o ${e.nome}, vale a maior nota.${best ? ` Seu melhor no simulado até agora: ${best} acertos.` : ""}</p>`;

// encerrar antes do fim: confirma com um segundo clique (o visualizador não mostra confirm())
let endArmed = 0;
function endNow(btn) {
  if (!endArmed) {
    btn.textContent = "Confirmar encerramento"; btn.classList.add("armed");
    endArmed = setTimeout(() => { endArmed = 0; btn.textContent = "Encerrar prova"; btn.classList.remove("armed"); }, 4000);
    return;
  }
  clearTimeout(endArmed); endArmed = 0;
  if (free()) closeAll(); else closeBlock();
  finish(false, true);
}

function start() {
  s = { p: chosen, b: 0, lvs: [], ups: 0, res: [], trocas: 0, end: Date.now() + DURATION };
  if (!prova(s.p).adapt) s.blocks = [0, 1, 2, 3].map(b => ({ qs: pool(s.p, b, 0), ans: {}, disc: [], cur: 0 }));
  tick = setInterval(clock, 1000);
  openBlock(); window.scrollTo(0, 0);
}
// sem trilha não há motivo para trancar blocos (só nas provas clássicas)
const free = () => !!s.blocks;
function switchBlock(b) {
  Object.assign(s.blocks[s.b], { qs: s.qs, ans: s.ans, disc: s.disc, cur: s.cur });
  s.b = b; Object.assign(s, s.blocks[b]);
  renderBlock(); window.scrollTo(0, 0);
}

function openBlock() {
  if (free()) { s.lvs = [0, 0, 0, 0]; Object.assign(s, s.blocks[s.b]); return renderBlock(); }
  const adapt = prova(s.p).adapt, n = nLevels(s.p, s.b);
  const lv = !adapt ? 0 : s.b === 0 ? Math.floor(Math.random() * n) : Math.min(s.ups, n - 1);
  s.lvs.push(lv);
  Object.assign(s, { qs: adapt ? shuffle(pool(s.p, s.b, lv)) : pool(s.p, s.b, lv), ans: {}, disc: [], cur: 0 });
  renderBlock();
}

function clock() {
  const left = Math.max(0, s.end - Date.now()), el = document.getElementById("timer");
  if (el) {
    el.textContent = `${String(Math.floor(left / 6e4)).padStart(2, "0")}:${String(Math.floor(left / 1e3) % 60).padStart(2, "0")}`;
    el.classList.toggle("low", left < 10 * 6e4);
  }
  if (!left) timeUp();
}

const trackName = (b, lv) => b === 0 ? (nLevels(s.p, 0) > 1 ? `versão ${lv + 1}` : "") : nLevels(s.p, b) > 1 ? `nível ${lv + 1} de ${nLevels(s.p, b)}` : "";

// recorte da questão com as letras posicionadas sobre cada alternativa
const ZOOM = { l: 0.045, w: 0.91 }; // conteúdo dos cadernos 2024.1/2025.1 fica entre 11% e 92% da largura
function page(q, cls = () => "", clickable = false) {
  const z = prova(q.prova).adapt, px = x => z ? (x - ZOOM.l) / ZOOM.w : x;
  return `<div class="page${z ? " zoom" : ""}"><img src="img/${q.id}.png" alt="Questão ${q.id}" loading="lazy" width="882" height="${Math.round(882 / q.ar)}">
    ${q.lettered ? "" : q.opts.map(([x, y], j) => `<${clickable ? "button" : "span"} class="badge ${cls(j)}" ${clickable ? `data-o="${j}"` : ""} style="left:${px(x) * 100}%;top:${y * 100}%" aria-hidden="true">${L[j]}</${clickable ? "button" : "span"}>`).join("")}</div>`;
}

// uma questão por vez (carrossel); a barra do topo e o rodapé ficam fixos
function renderBlock() {
  app.innerHTML = `
    <div class="bar"><div class="in">
      <div class="blocks">${[0, 1, 2, 3].map(b => free()
        ? `<button class="blk ${b === s.b ? "now" : ""}" data-blk="${b}" aria-pressed="${b === s.b}">Bloco ${b + 1}</button>`
        : `<div class="blk ${b < s.b ? "done" : b === s.b ? "now" : ""}">Bloco ${b + 1}</div>`).join("")}</div>
      <div class="dots" id="dots" aria-label="Situação das questões do bloco"></div>
      <span class="trocas" id="trocas" role="status"></span>
      <div class="timer" id="timer" aria-label="Tempo restante">120:00</div><button class="theme end" id="end">Encerrar prova</button>${themeBtn()}
    </div></div>
    <div class="wrap exam">
      <div class="qs" id="slide"></div>
    </div>
    <div class="foot"><div class="in">
      <div class="nav">
        <button id="prev">← Voltar</button>
        <button id="disc" class="disc"></button>
        <button id="next">Avançar →</button>
      </div>
      <button class="primary" id="send"></button>
    </div></div>`;
  document.getElementById("prev").onclick = () => go(s.cur - 1);
  document.getElementById("next").onclick = () => go(s.cur + 1);
  document.getElementById("disc").onclick = () => { const i = s.cur; s.disc = s.disc.includes(i) ? s.disc.filter(k => k !== i) : [...s.disc, i]; renderSlide(); };
  document.getElementById("send").onclick = send;
  document.getElementById("end").onclick = e => endNow(e.currentTarget);
  app.querySelectorAll("[data-blk]").forEach(x => x.onclick = () => switchBlock(+x.dataset.blk));
  renderSlide(); clock(); showTrocas();
}
function go(i) { if (i < 0 || i >= s.qs.length) return; s.cur = i; renderSlide(); window.scrollTo(0, 0); }
function renderSlide() {
  const i = s.cur, q = s.qs[i], off = s.disc.includes(i), n = [0, 8, 14, 20][s.b] + i + 1;
  document.getElementById("slide").innerHTML = `
    <section class="q ${off ? "off" : ""}">
      <div class="qh"><span class="qn">Questão ${n} · ${i + 1} de ${s.qs.length}</span><span class="qn">Prova ${s.p} · bloco ${s.b + 1}${trackName(s.b, s.lvs[s.b]) ? " · " + trackName(s.b, s.lvs[s.b]) : ""}</span></div>
      ${page(q, j => s.ans[i] === j ? "on" : "", !off)}
      <div class="answers" role="group" aria-label="Resposta da questão ${n}">
        ${L.split("").map((l, j) => `<button class="opt" data-o="${j}" aria-pressed="${s.ans[i] === j}" ${off ? "disabled" : ""}>${l}</button>`).join("")}
      </div>
    </section>`;
  document.getElementById("slide").querySelectorAll("[data-o]").forEach(btn => btn.onclick = () => {
    s.ans[i] = s.ans[i] === +btn.dataset.o ? undefined : +btn.dataset.o; renderSlide();
  });
  const d = document.getElementById("disc");
  d.textContent = off ? "Desfazer descarte" : "Descartar";
  d.classList.toggle("on", off);
  document.getElementById("prev").disabled = i === 0;
  document.getElementById("next").disabled = i === s.qs.length - 1;
  status(); saveProgress(); fit();
}
// a questão inteira cabe na altura da tela: limita a largura do recorte pela altura disponível
// texto dos recortes: ~11 pt × 1,6 = 17,6 px numa imagem de 882 px; nunca mostrar menor que MIN_FONT (questões longas rolam)
const MIN_FONT = 14, TXT = 17.6, IMG_W = 882;
function fit() {
  const pg = document.querySelector("#slide .page"); if (!pg) return;
  const q = s.qs[s.cur], ar = prova(q.prova).adapt ? q.ar * ZOOM.w : q.ar;
  const h = sel => document.querySelector(sel)?.offsetHeight || 0;
  const avail = innerHeight - h(".bar") - h(".foot") - h("#slide .qh") - h("#slide .answers") - 24;
  const minW = MIN_FONT / TXT * IMG_W * (prova(q.prova).adapt ? ZOOM.w : 1);
  pg.style.maxWidth = Math.max(minW, Math.floor(avail * ar)) + "px";
}
window.addEventListener("resize", fit);

// setas do teclado navegam entre as questões
document.addEventListener("keydown", e => {
  if (!s?.qs || !document.getElementById("slide") || e.target.closest?.("input,textarea")) return;
  if (e.key === "ArrowLeft") go(s.cur - 1);
  if (e.key === "ArrowRight") go(s.cur + 1);
});


function status() {
  const n = s.qs.length;
  const offset = [0, 8, 14, 20][s.b], dots = document.getElementById("dots");
  dots.innerHTML = s.qs.map((_, i) => {
    const st = s.disc.includes(i) ? ["off", "descartada"] : s.ans[i] !== undefined ? ["ans", "respondida"] : ["", "em branco"];
    return `<button class="dot ${st[0]} ${i === s.cur ? "cur" : ""}" data-go="${i}" title="Questão ${offset + i + 1}: ${st[1]}" aria-label="Questão ${offset + i + 1}, ${st[1]}">${offset + i + 1}</button>`;
  }).join("");
  dots.querySelectorAll("[data-go]").forEach(d => d.onclick = () => go(+d.dataset.go));
  document.getElementById("send").textContent = s.b < 3 ? (free() ? "Próximo bloco →" : `Enviar bloco ${s.b + 1}`) : "Finalizar prova";
}

function closeAll() {
  Object.assign(s.blocks[s.b], { qs: s.qs, ans: s.ans, disc: s.disc, cur: s.cur });
  s.blocks.forEach((blk, b) => { s.b = b; Object.assign(s, blk); closeBlock(); });
}
function send() {
  if (free()) { if (s.b < 3) return switchBlock(s.b + 1); closeAll(); return finish(); }
  closeBlock();
  if (s.b < 3) { s.b++; openBlock(); window.scrollTo(0, 0); } else finish();
}

function closeBlock() {
  const lv = s.lvs[s.b], r = grade(s.qs, s.ans, s.disc);
  s.res.push({ b: s.b, lv, ...r, pts: r.c * points(s.p, s.b, lv), qs: s.qs, ans: s.ans, disc: s.disc });
  if (r.up) s.ups++;
}

function timeUp() {
  if (free()) closeAll(); else closeBlock();
  finish(true);
}

function finish(timeout, early = false) {
  clearInterval(tick); s.done = true; clearProgress();
  const total = Math.min(100, s.res.reduce((a, r) => a + r.pts, 0)), hits = s.res.reduce((a, r) => a + r.c, 0);
  const used = Math.round((DURATION - Math.max(0, s.end - Date.now())) / 6e4);
  saveAttempt({ at: Date.now(), prova: s.p, score: +total.toFixed(1), hits, minutes: used, timeout: !!timeout, early, trocas: s.trocas, levels: s.lvs });
  let num = 0;
  app.innerHTML = `<div class="wrap" style="display:grid;gap:20px">
    <div class="top"><div class="eyebrow">Prova ${s.p} · ${timeout ? "tempo esgotado" : early ? "encerrada antes do fim" : "finalizada"} · ${used} min usados</div><div class="top-actions">${starWrap()}${fbBtn()}${themeBtn()}</div></div>
    <div class="sheet">
      <div class="score"><span class="big">${total.toFixed(1).replace(".", ",")}</span><span class="kv">de 100 pontos</span></div>
      ${s.trocas ? `<p class="elim">Você saiu da tela da prova ${s.trocas} ${s.trocas > 1 ? "vezes" : "vez"}. Na prova online isso fica registrado e pode reduzir seu tempo ou, nos casos mais graves, desclassificar.</p>` : ""}
      ${s.res.some(r => r.penalty) ? `<p class="note">Sem descarte em ${s.res.filter(r => r.penalty).map(r => "bloco " + (r.b + 1)).join(", ")}: 1 acerto foi desconsiderado em cada um, como manda o edital.</p>` : ""}
      <div class="score">
        <span class="kv">Acertos <b>${hits}/20</b></span>
        ${s.res.map(r => `<span class="kv">Bloco ${r.b + 1} <b>${r.c}/${r.n}</b>${trackName(r.b, r.lv) ? " · " + trackName(r.b, r.lv) : ""}</span>`).join("")}
        <span class="kv">Saídas da tela <b>${s.trocas}</b></span>
      </div>
      <p class="note">Não existe nota de corte fixa: o corte muda a cada ano conforme os candidatos (são chamados para a próxima etapa pelo menos 3 vezes o número de vagas). Os 10 acertos que aparecem no edital são só uma referência de equivalência, e já houve aprovação com 8 acertos.</p>
      <div><button class="primary" id="again">Ver histórico e fazer outra prova</button></div>
    </div>
    ${s.res.map(r => `<h2>Bloco ${r.b + 1} ${trackName(r.b, r.lv) ? `<span class="trk">${trackName(r.b, r.lv)}</span>` : ""}</h2>
      ${r.qs.map((q, i) => {
        num++;
        const off = i === r.excl, extra = !off && r.disc.includes(i), got = extra ? undefined : r.ans[i], ok = got === q.ans;
        const chip = off ? `<span class="chip off">${r.penalty ? "Desconsiderada (sem descarte)" : "Descartada"}</span>`
          : extra ? `<span class="chip bad">Descarte a mais · conta como erro</span>`
          : ok ? `<span class="chip ok">Acertou</span>` : `<span class="chip bad">${got === undefined ? "Em branco" : "Errou"}</span>`;
        return `<section class="q">
          <div class="qh"><span class="qn">Questão ${num}</span>${chip}</div>
          ${page(q, j => j === q.ans ? "right" : j === got && !off ? "wrong" : "")}
          <div class="res">
            <span>${off ? "" : `Sua resposta: <b>${got === undefined ? "em branco" : L[got]}</b> · `}Correta: <b>${L[q.ans]}</b></span>
            ${q.sol ? `<details><summary>Ver resolução</summary><div class="page"><img src="img/${q.id}s.png" alt="Resolução" loading="lazy"></div></details>` : ""}
            <button class="fb-link" data-fb="Prova ${s.p} · questão ${num} (${q.id})">Achou um erro nesta questão?</button>
          </div>
        </section>`;
      }).join("")}`).join("")}
  </div>`;
  document.getElementById("again").onclick = intro;
  window.scrollTo(0, 0);
}

const saved = loadProgress();
if (saved) {
  s = saved; s.trocas = (s.trocas || 0) + 1; // atualizar a página conta como saída da tela
  if (Date.now() >= s.end) timeUp(); else { tick = setInterval(clock, 1000); renderBlock(); }
} else { intro(); welcome(); }

function welcome() {
  try { if (localStorage.getItem("boasVindas")) return; } catch {}
  const d = document.createElement("dialog");
  d.className = "welcome";
  d.setAttribute("aria-labelledby", "welcome-title");
  d.innerHTML = `
    <h2 id="welcome-title">Bem-vindo ao Simulado Eixo Prova 👋</h2>
    <p>Um simulador da prova de matemática e lógica do Inteli, com <b>questões reais</b> (2022.1 a 2025.1) e as regras do <b>edital 2027</b>.</p>
    <ul class="rules">
      <li><b>5 provas</b>, 2 delas <b>adaptativas</b> como a real</li>
      <li>Correção na hora, com gabarito e <b>resolução oficial</b></li>
      <li><b>Histórico</b> de notas e calculadora ENEM, SAT, ACT e IB</li>
      <li>Achou um erro ou tem uma ideia? Botão <b>Feedback</b> no topo, sem login</li>
    </ul>
    <p class="note">Faça como no dia: 2 horas, lugar tranquilo e só calculadora básica.</p>
    <p class="by">Criado por <a href="https://www.linkedin.com/in/luiz-cazelatto/" target="_blank" rel="noopener">Luiz Cazelatto</a>, de um aluno para futuros alunos. Se ajudar, deixa uma ⭐ no GitHub!</p>
    <button class="primary" id="welcome-ok" autofocus>Bora treinar!</button>`;
  // fecha pelo botão, clicando fora do cartão ou com Esc; a escolha fica salva para não aparecer de novo
  const done = () => { try { localStorage.setItem("boasVindas", "1"); } catch {} if (d.open) d.close(); d.remove(); };
  d.querySelector("#welcome-ok").onclick = done;
  d.addEventListener("click", e => { if (e.target === d) done(); });
  d.addEventListener("cancel", e => { e.preventDefault(); done(); });
  document.body.appendChild(d);
  d.showModal();
}

const FB_TIPOS = ["Sugestão", "Melhoria", "Erro em questão", "Bug"];
// Google Forms "Feedback · Simulado Eixo Prova": ids dos campos tirados do próprio formulário
const FB_FORM = { url: "https://docs.google.com/forms/d/e/1FAIpQLSeJvJi4_ECfUJO4B19YuZF9QtolHLzCV3ULQyutOfljrLfV9w", tipo: "entry.448938689", msg: "entry.1285465240", questao: "entry.274878571", disp: "entry.1436630446" };
document.addEventListener("click", e => { const b = e.target.closest?.("[data-fb]"); if (b) feedback(b.dataset.fb); });
function feedback(ctx) {
  const d = document.createElement("dialog");
  d.className = "welcome";
  d.setAttribute("aria-labelledby", "fb-title");
  d.innerHTML = `
    <h2 id="fb-title">${ctx ? "Reportar erro" : "Mande seu feedback"}</h2>
    <p>${ctx ? `<b>${ctx}</b>. Gabarito errado, imagem cortada, enunciado confuso: conte o que viu.` : "Sugestões, melhorias, erros ou bugs: tudo ajuda a deixar o simulado melhor."}</p>
    <form style="display:grid;gap:10px">
      <fieldset class="fb-tipos" aria-label="Tipo">${FB_TIPOS.map(t => `<label><input type="radio" name="tipo" value="${t}" ${t === (ctx ? "Erro em questão" : "Sugestão") ? "checked" : ""}>${t}</label>`).join("")}</fieldset>
      <textarea name="msg" required maxlength="2000" aria-label="Mensagem" placeholder="Escreva aqui"></textarea>
      <p class="by">Anônimo: não precisa de login. Vai junto só a questão (se houver), o tamanho da tela e o navegador, para ajudar a achar bugs.</p>
      <div class="fb-acts"><button type="button" data-close>Cancelar</button><button class="primary">Enviar</button></div>
    </form>`;
  const form = d.querySelector("form"), done = () => { if (d.open) d.close(); d.remove(); };
  form.onsubmit = async e => {
    e.preventDefault();
    const msg = form.msg.value.trim();
    if (!msg) return form.msg.focus();
    const data = new URLSearchParams({ [FB_FORM.tipo]: form.tipo.value, [FB_FORM.msg]: msg, [FB_FORM.questao]: ctx, [FB_FORM.disp]: `${innerWidth}×${innerHeight} · ${navigator.userAgent}` });
    form.querySelector(".primary").disabled = true;
    try {
      // no-cors: o Google não deixa ler a resposta, mas grava; só uma falha de rede cai no catch
      await fetch(`${FB_FORM.url}/formResponse`, { method: "POST", mode: "no-cors", body: data });
      d.innerHTML = `<h2 id="fb-title">Valeu pelo feedback! 💜</h2><p>Recebido. Cada sugestão ajuda os próximos futuros Intelers.</p><button class="primary" data-close>Fechar</button>`;
    } catch {
      // sem conexão com o Google: abre o formulário já preenchido para enviar por lá
      window.open(`${FB_FORM.url}/viewform?usp=pp_url&${data}`, "_blank", "noopener");
      done(); return;
    }
    d.querySelector("[data-close]").onclick = done;
  };
  d.querySelector("[data-close]").onclick = done;
  d.addEventListener("click", e => { if (e.target === d) done(); });
  d.addEventListener("cancel", e => { e.preventDefault(); done(); });
  document.body.appendChild(d);
  d.showModal();
  form.msg.focus();
}
</script>
